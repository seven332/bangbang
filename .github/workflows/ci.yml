name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    name: kani
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Kani
        run: |
          rustup toolchain install nightly-2025-11-21 --profile minimal
          cargo +nightly-2025-11-21 install --locked --version 0.67.0 kani-verifier
          cargo kani setup

      - name: Run targeted Kani verification
        run: python3 scripts/run-kani.py

  rust:
    name: rust
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --target aarch64-apple-darwin,aarch64-unknown-linux-musl
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache guest artifacts
        uses: actions/cache@v6
        with:
          path: .tmp/guest-artifacts
          key: guest-artifacts-firecracker-v1.15-aarch64-vmlinux-6.1.155-e3544b10603acbf3db492cb52e000d22ba202cb4b63b9add027565683e11c591-rootfs-ubuntu-24.04-0efb6a3ff2982baa6ca7e3d940966516ba7ddd2df5deb3e6c2161d369a15d608

      - name: Test guest artifact policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Fetch Firecracker guest kernel
        run: scripts/fetch-firecracker-kernel.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check unsupported launcher target
        run: cargo check -p bangbang-launcher --all-targets --all-features --locked --target aarch64-unknown-linux-musl

      - name: Check unsupported CPU-template helper target
        run: cargo check -p bangbang-cpu-template-helper --all-targets --all-features --locked --target aarch64-unknown-linux-musl

      - name: Build statically isolated elevated-bootstrap evidence bundle
        run: |
          mkdir -p "$RUNNER_TEMP/elevated-bootstrap"
          scripts/build-elevated-bootstrap-probe.sh \
            --output "$RUNNER_TEMP/elevated-bootstrap/Bangbang.app"

      - name: Verify elevated proof requires explicit root
        run: |
          for invalid_uid in 0 0501 4294967296 '1:2'; do
            set +e
            invalid_output="$(scripts/run-elevated-bootstrap-probe.sh \
              --bundle "$RUNNER_TEMP/elevated-bootstrap/Bangbang.app" \
              --target-uid "$invalid_uid" \
              --target-gid 20 2>&1)"
            invalid_status=$?
            set -e
            if [[ "$invalid_status" -ne 2 \
              || "$invalid_output" != "target uid and gid must be explicit nonzero decimal values" ]]; then
              echo "elevated proof accepted a malformed target identity" >&2
              exit 1
            fi
          done
          set +e
          proof_output="$(scripts/run-elevated-bootstrap-probe.sh \
            --bundle "$RUNNER_TEMP/elevated-bootstrap/Bangbang.app" \
            --target-uid 501 \
            --target-gid 20 2>&1)"
          proof_status=$?
          set -e
          if [[ "$proof_status" -ne 4 \
            || "$proof_output" != "bangbang elevated bootstrap proof: explicit root required" ]]; then
            echo "elevated proof did not preserve its explicit-root boundary" >&2
            exit 1
          fi

      - name: Validate Firecracker capability inventory
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate

      - name: Certify macOS guest workflow scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --guest-workflow-final

      - name: Certify targeted formal verification scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --formal-verification-final

      - name: Certify CPU-template dump and verify scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --cpu-template-helper-final

      - name: Certify portable CPU-template strip scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --cpu-template-strip-final

      - name: Certify platform-tagged CPU-fingerprint dump scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --cpu-template-fingerprint-dump-final

      - name: Certify deterministic CPU-fingerprint compare scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --cpu-template-fingerprint-compare-final

      - name: Certify aggregate CPU-template compatibility scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --cpu-template-final

      - name: Certify terminal Wave 7 aggregate scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --wave7-final

      - name: Certify terminal Wave 8 platform-feasible scope
        run: cargo run -p bangbang-firecracker-capability-audit --locked -- validate --wave8-final

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked --exclude bangbang-hvf

      - name: Verify vmnet preflight fails closed without credentials
        run: |
          set +e
          preflight_output="$(scripts/preflight-production-vmnet.sh \
            --output "$RUNNER_TEMP/Bangbang.app" \
            --signing-identity "Unavailable CI Identity" \
            --provisioning-profile "$RUNNER_TEMP/absent.provisionprofile" 2>&1)"
          preflight_status=$?
          set -e
          if [[ "$preflight_status" -ne 3 || "$preflight_output" != "bangbang vmnet preflight: blocked" ]]; then
            echo "vmnet preflight did not produce the fixed blocked contract" >&2
            exit 1
          fi

      - name: Run HVF unit tests
        run: cargo test -p bangbang-hvf --lib --all-features --locked

      - name: Run signed process e2e tests
        run: scripts/run-signed-process-tests.sh

      - name: Build and sign integration tests
        run: scripts/run-integration-tests.sh --allow-unsupported

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run clippy on signed integration targets
        run: |
          cargo clippy -p bangbang --test executable_hvf_e2e --all-features --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p bangbang --test app_sandbox_process_e2e --all-features --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p bangbang-hvf --test hvf_lifecycle --all-features --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p bangbang-hvf --test guest_boot --all-features --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p bangbang-launcher --test production_bundle_e2e --all-features --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p bangbang-cpu-template-helper --test hvf_e2e --all-features --locked --target aarch64-apple-darwin -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
